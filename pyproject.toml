[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snipvault"
version = "0.1.0"
description = "A small local web app for storing code snippets (Flask + SQLite)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chad Mowlavie" }]
keywords = ["snippets", "flask", "sqlite", "code"]
classifiers = [
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["flask>=2.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
snipvault = "snipvault.cli:main"

[project.urls]
Homepage = "https://github.com/Chad9100/snipvault"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snipvault = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
