{% extends "base.html" %}
{% block title %}Sign in - snipvault{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="flash">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.login_post') }}">
  {{ csrf_field() }}
  <input type="hidden" name="next" value="{{ next }}">
  <p><label>Access token <input type="password" name="token" autofocus required></label></p>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
