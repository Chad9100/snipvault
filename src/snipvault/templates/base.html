<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}snipvault{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('web.index') }}">snipvault</a>
  <form class="search" action="{{ url_for('web.index') }}" method="get">
    <input type="search" name="q" value="{{ q or '' }}" placeholder="Search snippets" aria-label="Search">
    <button type="submit">Search</button>
  </form>
  <a class="button" href="{{ url_for('web.new') }}">New snippet</a>
</header>
<main>
{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
{% block content %}{% endblock %}
</main>
<footer>snipvault is a local tool: it has no login. Keep it on 127.0.0.1.</footer>
<script src="{{ url_for('static', filename='copy.js') }}"></script>
</body>
</html>
