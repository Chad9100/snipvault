{% extends "base.html" %}
{% block title %}Import / export - snipvault{% endblock %}
{% block content %}
<h1>Import / export</h1>
<p><a class="button" href="{{ url_for('web.export') }}">Download all snippets (JSON)</a></p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('web.import_upload') }}" enctype="multipart/form-data" class="stack">
  {{ csrf_field() }}
  <label>Import a snipvault JSON file <input type="file" name="file" accept=".json,application/json"></label>
  <button type="submit">Import</button>
</form>
<p class="muted">Imported snippets are added; existing ones are never overwritten.</p>
{% endblock %}
