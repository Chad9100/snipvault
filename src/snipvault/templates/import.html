{% extends "base.html" %}
{% block title %}Import / export - snipvault{% endblock %}
{% block content %}
<h1>Import / export</h1>
<p><a class="button" href="{{ url_for('web.export') }}">Download all snippets (JSON)</a></p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('web.import_upload') }}" enctype="multipart/form-data" class="stack">
  {{ csrf_field() }}
  <label>Import a snipvault JSON file <input type="file" name="file" accept=".json,application/json"></label>
  <label>If a snippet with the same title and language exists
    <select name="on_duplicate">
      <option value="add">add it anyway</option>
      <option value="skip">skip it</option>
      <option value="replace">replace its body and tags</option>
    </select></label>
  <label><input type="checkbox" name="dry_run" value="1"> Dry run (preview only, save nothing)</label>
  <button type="submit">Import</button>
</form>
{% endblock %}
